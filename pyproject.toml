[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hollow-knight-local-agent"
version = "0.0.0"
description = "Local, experience-driven Hollow Knight agent environment"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = ["Pillow>=10,<13"]

[project.urls]
Homepage = "https://github.com/Thayrone-L/VoidGym"
Repository = "https://github.com/Thayrone-L/VoidGym.git"
Issues = "https://github.com/Thayrone-L/VoidGym/issues"

[project.optional-dependencies]
environment = [
    "gymnasium>=1.2,<2",
    "numpy>=2.2,<3",
    "psutil>=7,<8",
]
training = [
    "safetensors>=0.8,<1",
    "stable-baselines3==2.9.0",
    "sb3-contrib==2.9.0",
]
development = [
    "pytest>=8,<10",
    "ruff>=0.12,<1",
    "safetensors>=0.8,<1",
    "mypy>=1.17,<2",
]
instances = [
    "UnityPy>=1.20,<2",
]
map = [
    "pyvips[binary]>=3.1,<4",
]

[project.scripts]
hk-agent = "hk_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: ciclo ponta a ponta sem o jogo"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-select = ["C901", "I", "N"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
"src/hk_agent/**/*.py" = ["C901", "I", "N"]
"tests/test_*.py" = ["C901", "I", "N"]
"tools/*.py" = ["C901", "I", "N"]
"tools/scripted_validation/**/*.py" = ["C901", "I", "N"]

[tool.mypy]
python_version = "3.12"
strict = true
