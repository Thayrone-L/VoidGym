name: v2 tests
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  v2:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . -r requirements-dev.lock -r requirements-training.lock
      - run: ruff check src tools tests
      - run: mypy src/voidgym
      - run: pytest tests/v2 -m "not e2e"
      - run: pytest -m e2e
